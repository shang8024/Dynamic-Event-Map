# Keep script hosts narrow: Google Maps/Places and Firebase's Google popup helper.
# Maps still needs eval/blob workers and inline styles; inline scripts/handlers
# remain blocked. Re-test the policy whenever these SDKs change.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-eval' https://maps.googleapis.com https://maps.gstatic.com https://apis.google.com https://www.google.com https://www.gstatic.com blob:; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.googleusercontent.com https://*.ggpht.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' wss://$host https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.firebaseapp.com https://*.web.app data: blob:; frame-src 'self' https://*.firebaseapp.com https://*.web.app https://accounts.google.com https://www.google.com https://recaptcha.google.com; worker-src 'self' blob:; manifest-src 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Retain the opener needed by Firebase signInWithPopup; COEP is not enabled.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
# Browsers ignore HSTS over plain HTTP (including local container checks).
add_header Strict-Transport-Security "max-age=31536000" always;
