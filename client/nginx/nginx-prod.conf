resolver 127.0.0.11 ipv6=off valid=10s;
server_tokens off;
# Paths/statuses are enough for operations; never log query-string unsubscribe
# tokens, Authorization headers, cookies or user-supplied request bodies.
log_format eventmap_safe escape=json '{"status":$status,"method":"$request_method","path":"$uri","bytes":$body_bytes_sent,"duration":$request_time}';
map $arg_sid $sticky_id {
  ""       $remote_addr;
  default  $arg_sid;
}
upstream api_backend {
  zone api_backend 64k;
  ip_hash;
  server tasks.eventmap_api:5000 resolve;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 128k;
  access_log /dev/stdout eventmap_safe;
  include /etc/nginx/snippets/security-headers.conf;
  location / {
    try_files $uri $uri/ /index.html;
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    include /etc/nginx/snippets/security-headers.conf;
  }
  location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }
  # --- Socket.IO WebSocket ---
  location /socket.io/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_pass http://api_backend/socket.io/;
  }
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache     off;
    proxy_read_timeout  30s;
    proxy_send_timeout  30s;
    proxy_pass http://api_backend;
  }
}
