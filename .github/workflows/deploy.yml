name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: eventmap-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.PRODUCTION_ENABLED == 'true' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build and publish one immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          set -euo pipefail
          : "${GOOGLE_MAPS_KEY:?Configure browser Maps key}"
          : "${FIREBASE_API_KEY:?Configure Firebase browser key}"
          : "${FIREBASE_PROJECT_ID:?Configure Firebase project}"
          : "${FIREBASE_APP_ID:?Configure Firebase app}"
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_PREFIX=$IMAGE_PREFIX" >> "$GITHUB_ENV"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for pair in api:api events-ingest:infra/ingest db-backup:infra/backup; do
            component="${pair%%:*}"
            context="${pair#*:}"
            docker buildx build --platform linux/amd64 --push --provenance=false \
              --tag "$IMAGE_PREFIX-$component:$GITHUB_SHA" "$context"
          done
          docker buildx build --platform linux/amd64 --push --provenance=false \
            --tag "$IMAGE_PREFIX-client:$GITHUB_SHA" \
            --build-arg VITE_API_BASE_URL=/api \
            --build-arg "VITE_GOOGLE_MAPS_KEY=$GOOGLE_MAPS_KEY" \
            --build-arg "VITE_FIREBASE_API_KEY=$FIREBASE_API_KEY" \
            --build-arg "VITE_FIREBASE_AUTH_DOMAIN=$FIREBASE_PROJECT_ID.firebaseapp.com" \
            --build-arg "VITE_FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" \
            --build-arg "VITE_FIREBASE_STORAGE_BUCKET=$FIREBASE_PROJECT_ID.firebasestorage.app" \
            --build-arg "VITE_FIREBASE_APP_ID=$FIREBASE_APP_ID" \
            --build-arg "VITE_FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID" ./client
      - name: Upload deployment files and wait for the release
        env:
          DO_SSH_HOST: ${{ vars.DO_SSH_HOST }}
          DO_SSH_USER: ${{ vars.DO_SSH_USER }}
          DO_SSH_FINGERPRINT: ${{ vars.DO_SSH_FINGERPRINT }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_SSH_PASSPHRASE: ${{ secrets.DO_SSH_PASSPHRASE }}
        run: |
          source infra/scripts/ci_ssh.sh
          tar -czf "$RUNNER_TEMP/eventmap-release.tar.gz" \
            stack.yml stack.notifications.yml db infra/scripts infra/system infra/env/.env.production.example
          ssh_ci "sudo -n install -d -m 700 '/root/eventmap-releases/$GITHUB_SHA' && sudo -n tar --no-same-owner -xzf - -C '/root/eventmap-releases/$GITHUB_SHA'" \
            < "$RUNNER_TEMP/eventmap-release.tar.gz"
          ssh_ci "sudo -n bash '/root/eventmap-releases/$GITHUB_SHA/infra/scripts/deploy.sh' '$IMAGE_PREFIX' '$GITHUB_SHA' '/root/eventmap-releases/$GITHUB_SHA'"
