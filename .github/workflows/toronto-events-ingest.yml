name: Toronto Events Ingest

# Daily work runs on the host timer; this is a manual fallback.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eventmap-production
  cancel-in-progress: false

jobs:
  ingest:
    if: vars.PRODUCTION_ENABLED == 'true' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run bounded import and verify its exact task exit code
        env:
          DO_SSH_HOST: ${{ vars.DO_SSH_HOST }}
          DO_SSH_USER: ${{ vars.DO_SSH_USER }}
          DO_SSH_FINGERPRINT: ${{ vars.DO_SSH_FINGERPRINT }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_SSH_PASSPHRASE: ${{ secrets.DO_SSH_PASSPHRASE }}
        run: |
          source infra/scripts/ci_ssh.sh
          ssh_ci 'sudo -n bash /root/deploy/infra/scripts/run_swarm_job.sh ingest'
