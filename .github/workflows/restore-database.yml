name: Database Recovery Rehearsal

on:
  workflow_dispatch:
    inputs:
      list_backups:
        description: List checksum-verified backup filenames only
        type: boolean
        default: true
      backup_file:
        description: Exact backup basename ending .dump (no URL or path)
        type: string
        required: false
      recovery_database:
        description: A NEW recovery_ database, e.g. recovery_20261021
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: eventmap-production
  cancel-in-progress: false

jobs:
  recovery:
    if: vars.PRODUCTION_ENABLED == 'true' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: List backups or restore to a new recovery database
        env:
          LIST_BACKUPS: ${{ inputs.list_backups }}
          BACKUP_FILE: ${{ inputs.backup_file }}
          RECOVERY_DATABASE: ${{ inputs.recovery_database }}
          DO_SSH_HOST: ${{ vars.DO_SSH_HOST }}
          DO_SSH_USER: ${{ vars.DO_SSH_USER }}
          DO_SSH_FINGERPRINT: ${{ vars.DO_SSH_FINGERPRINT }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_SSH_PASSPHRASE: ${{ secrets.DO_SSH_PASSPHRASE }}
        run: |
          source infra/scripts/ci_ssh.sh
          if [[ "$LIST_BACKUPS" == true ]]; then
            ssh_ci 'sudo -n bash /root/deploy/infra/scripts/run_swarm_job.sh list'
          else
            [[ "$BACKUP_FILE" =~ ^backup_[a-zA-Z0-9_]+_[a-zA-Z0-9_]+\.dump$ ]] || exit 1
            [[ "$RECOVERY_DATABASE" =~ ^recovery_[a-z0-9_]{1,54}$ ]] || exit 1
            ssh_ci "sudo -n bash /root/deploy/infra/scripts/run_swarm_job.sh restore '$BACKUP_FILE' '$RECOVERY_DATABASE'"
          fi
