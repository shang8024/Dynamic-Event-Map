version: "3.9"

networks:
  proxy:
    driver: overlay
    external: false
  internal:
    driver: overlay
    external: false
  images:
    driver: overlay
    external: false

volumes:
  pgdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/pgdata/postgres-data
  dbinit:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/deploy/db
  redisdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/pgdata/redis-data
  traefik-cert: {}
  client-static: {}

secrets:
  pg_password:
    external: true
  redis_password:
    external: true
  s3_access_key:
    external: true
  s3_secret_key:
    external: true
  unsubscribe_signing_secret:
    external: true

services:
  traefik:
    image: traefik:v3.7.16
    command:
      - --log.level=INFO
      - --api.dashboard=false

      # Use Swarm provider
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.network=eventmap_proxy

      # Entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      # HTTP->HTTPS redirect
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

      # Let's Encrypt
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - target: 80
        published: 80
        mode: ingress
      - target: 443
        published: 443
        mode: ingress
    volumes:
      - traefik-cert:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${DB_USER:-user}"
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_DB: "${DB_NAME:-eventsdb}"
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [pg_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - dbinit:/docker-entrypoint-initdb.d:ro   
    networks: [internal]
    deploy:
      placement: { constraints: [node.role == manager] }
      restart_policy: { condition: any, delay: 5s, max_attempts: 3 }
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1 -p 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  redis:
    image: redis:7-alpine
    command: >
      sh -c '
        PASS_FILE="/run/secrets/redis_password";
        PASS=$$(cat "$$PASS_FILE");
        exec redis-server \
          --appendonly yes \
          --appendfsync everysec \
          --dir /data \
          --save 900 1 --save 300 10 --save 60 10000 \
          --maxmemory 96mb --maxmemory-policy allkeys-lru \
          --requirepass "$$PASS";
      '
    networks: [internal]
    volumes:
      - redisdata:/data
    deploy:
      restart_policy: { condition: any, delay: 5s, max_attempts: 3 }
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
      placement: { constraints: [node.role == manager] }
    healthcheck:
      test:
      - CMD-SHELL
      - >
        REDIS_PASS=$$(cat /run/secrets/redis_password 2>/dev/null || true);
        redis-cli -a "$$REDIS_PASS" PING | grep PONG;
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    secrets:
      - redis_password

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/shang8024/dynamic-event-map-production}-api:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production             
      NODE_OPTIONS: --max-old-space-size=192
      PORT: "${BACKEND_PORT}"          
      DB_HOST: db
      DB_PORT: "${DB_PORT:-5432}"     
      DB_NAME: "${DB_NAME:-eventsdb}"
      DB_USER: "${DB_USER:-user}"
      REDIS_HOST: redis
      REDIS_PORT: "${REDIS_PORT:-6379}"
      DB_PASSWORD_FILE: /run/secrets/pg_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      ALLOWED_ORIGINS: "https://${DOMAIN},https://www.${DOMAIN}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID}"
      IMAGE_PROXY_URL: http://image_proxy:5100
      UNSUBSCRIBE_SIGNING_SECRET_FILE: /run/secrets/unsubscribe_signing_secret
      SES_FEEDBACK_TOPIC_ARN: "${SES_FEEDBACK_TOPIC_ARN:-}"
      SES_AUTO_CONFIRM_SUBSCRIPTION: "${SES_AUTO_CONFIRM_SUBSCRIPTION:-false}"
      EMAIL_PROVIDER: "${EMAIL_PROVIDER:-disabled}"
      EMAIL_DELIVERY_ENABLED: "${EMAIL_DELIVERY_ENABLED:-false}"
      EMAIL_FEEDBACK_READY: "${EMAIL_FEEDBACK_READY:-false}"
      FRONTEND_PORT: 443
    secrets:
      - pg_password
      - redis_password
      - unsubscribe_signing_secret
    networks: [proxy, internal, images]
    depends_on: [db, redis]
    deploy:
      replicas: ${API_REPLICAS:-1}
      update_config: { order: start-first }
      restart_policy: { condition: any }
      resources:
        limits:
          memory: 320M
        reservations:
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=eventmap_proxy"
        - "traefik.http.routers.api.rule=Host(`www.${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`))"
        - "traefik.http.routers.api.entrypoints=websecure"
        - "traefik.http.routers.api.tls.certresolver=le"
        - "traefik.http.routers.api.priority=10"
        - "traefik.http.routers.api.middlewares=eventmap-api-inflight,eventmap-response-security,eventmap-api-compress"
        # Aggregate HTTP work is capped before Node/DB work starts. WebSocket
        # connection limits are enforced separately by the application.
        - "traefik.http.middlewares.eventmap-api-inflight.inflightreq.amount=64"
        # Only JSON responses are compressed, leaving images and streaming /
        # Socket.IO transports unchanged. Negotiate gzip for bodies >= 1 KiB.
        - "traefik.http.middlewares.eventmap-api-compress.compress=true"
        - "traefik.http.middlewares.eventmap-api-compress.compress.encodings=gzip"
        - "traefik.http.middlewares.eventmap-api-compress.compress.includedcontenttypes=application/json"
        - "traefik.http.middlewares.eventmap-api-compress.compress.minresponsebodybytes=1024"
        - "traefik.http.services.api.loadbalancer.server.port=5000"
        - "traefik.http.services.api.loadbalancer.sticky.cookie=true"
        - "traefik.http.services.api.loadbalancer.sticky.cookie.name=sio_sticky"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${BACKEND_PORT} || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  image_proxy:
    image: ${IMAGE_PREFIX:-ghcr.io/shang8024/dynamic-event-map-production}-api:${IMAGE_TAG:-latest}
    command: ["node", "workers/imageProxy.js"]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=96
      IMAGE_PROXY_WORKER: "true"
      PORT: "5100"
    networks: [images]
    deploy:
      replicas: 1
      restart_policy: { condition: any }
      resources:
        limits: { memory: 256M, cpus: '0.5' }
        reservations: { memory: 64M }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5100/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

  client:
    image: ${IMAGE_PREFIX:-ghcr.io/shang8024/dynamic-event-map-production}-client:${IMAGE_TAG:-latest}
    networks: [proxy]
    depends_on: [api]
    deploy:
      replicas: 1
      update_config: { order: start-first, parallelism: 1, delay: 5s }
      restart_policy: { condition: any, delay: 5s, max_attempts: 3 }
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=eventmap_proxy"
        
        # Main router for www subdomain
        - "traefik.http.routers.client.rule=Host(`www.${DOMAIN}`)"
        - "traefik.http.routers.client.entrypoints=websecure"
        - "traefik.http.routers.client.tls.certresolver=le"
        - "traefik.http.routers.client.priority=5"
        - "traefik.http.routers.client.middlewares=eventmap-static-inflight,eventmap-response-security"
        - "traefik.http.middlewares.eventmap-static-inflight.inflightreq.amount=96"
        - "traefik.http.middlewares.eventmap-response-security.headers.contenttypenosniff=true"
        - "traefik.http.middlewares.eventmap-response-security.headers.framedeny=true"
        - "traefik.http.middlewares.eventmap-response-security.headers.referrerpolicy=strict-origin-when-cross-origin"
        - "traefik.http.middlewares.eventmap-response-security.headers.stsseconds=31536000"
        - "traefik.http.middlewares.eventmap-response-security.headers.customresponseheaders.Cross-Origin-Opener-Policy=same-origin-allow-popups"
        - "traefik.http.middlewares.eventmap-response-security.headers.customresponseheaders.Permissions-Policy=camera=(), microphone=(), payment=(), usb=(), geolocation=(self)"
        
        # Router for bare domain that redirects to www
        - "traefik.http.routers.client-redirect.rule=Host(`${DOMAIN}`)"
        - "traefik.http.routers.client-redirect.entrypoints=websecure"
        - "traefik.http.routers.client-redirect.tls.certresolver=le"
        - "traefik.http.routers.client-redirect.middlewares=eventmap-response-security,redirect-to-www"
        - "traefik.http.routers.client-redirect.priority=4"
        
        # Middleware to redirect to www
        - "traefik.http.middlewares.redirect-to-www.redirectregex.regex=^https?://(?:www\\.)?(.*)$$"
        - "traefik.http.middlewares.redirect-to-www.redirectregex.replacement=https://www.$$1"
        - "traefik.http.middlewares.redirect-to-www.redirectregex.permanent=true"
        
        - "traefik.http.services.client.loadbalancer.server.port=80"
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  events_ingest:
    image: ${IMAGE_PREFIX:-ghcr.io/shang8024/dynamic-event-map-production}-events-ingest:${IMAGE_TAG:-latest}
    secrets:
      - pg_password
      - redis_password
    environment:
      INGEST_ERROR_RATIO: "${INGEST_ERROR_RATIO:-0.1}"
      INGEST_ERROR_MINIMUM: "${INGEST_ERROR_MINIMUM:-3}"
      NODE_OPTIONS: --max-old-space-size=512
      DB_HOST: db
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-eventsdb}"
      DB_USER: "${DB_USER:-user}"
      REDIS_HOST: redis
      REDIS_PORT: "${REDIS_PORT:-6379}"
      DB_PASSWORD_FILE: /run/secrets/pg_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    depends_on: [db, redis]
    networks:
      - internal
    deploy:
      mode: replicated
      replicas: 0
      restart_policy:
        condition: none
      resources:
        limits:
          memory: 768M
          cpus: '0.75'

  db_backup:
    image: ${IMAGE_PREFIX:-ghcr.io/shang8024/dynamic-event-map-production}-db-backup:${IMAGE_TAG:-latest}
    secrets:
      - pg_password
      - s3_access_key
      - s3_secret_key
    environment:
      DB_HOST: db
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-eventsdb}"
      DB_USER: "${DB_USER:-user}"
      DB_PASSWORD_FILE: /run/secrets/pg_password
      S3_PROVIDER: "${S3_PROVIDER:-AWS}"
      S3_REGION: "${S3_REGION:-ca-central-1}"
      S3_BUCKET: "${S3_BUCKET:?Set S3_BUCKET}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_PREFIX: "${S3_PREFIX:-backups}"
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
    depends_on: [db]
    networks:
      - internal
    deploy:
      mode: replicated
      replicas: 0
      restart_policy:
        condition: none
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  db_restore:
    image: ${IMAGE_PREFIX:-ghcr.io/shang8024/dynamic-event-map-production}-db-backup:${IMAGE_TAG:-latest}
    secrets:
      - pg_password
      - s3_access_key
      - s3_secret_key
    environment:
      DB_HOST: db
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-eventsdb}"
      DB_USER: "${DB_USER:-user}"
      DB_PASSWORD_FILE: /run/secrets/pg_password
      BACKUP_FILE: ""
      RESTORE_DB_NAME: ""
      RESTORE_CONFIRM_TARGET: ""
      S3_PROVIDER: "${S3_PROVIDER:-AWS}"
      S3_REGION: "${S3_REGION:-ca-central-1}"
      S3_BUCKET: "${S3_BUCKET:?Set S3_BUCKET}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_PREFIX: "${S3_PREFIX:-backups}"
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
    depends_on: [db]
    networks:
      - internal
    entrypoint: ["/usr/local/bin/restore.sh"]
    deploy:
      mode: replicated
      replicas: 0
      restart_policy:
        condition: none
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
